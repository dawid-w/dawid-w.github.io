<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Grimo AI</title>
<meta name="description" content="Get in touch with the Grimo AI team.">

<link rel="icon" type="image/png" sizes="512x512" href="app-icon-6a-512.png">
<link rel="icon" type="image/png" sizes="180x180" href="app-icon-6a-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="app-icon-6a-180.png">

<style>
  :root{
    --ink:#1C1C1E;
    --dark:#141414;
    --hairline:oklch(93% 0 0);
    --muted:oklch(48% 0 0);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    background:#fff;
    color:var(--ink);
    font-family:-apple-system, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--ink);text-decoration:none;transition:color .25s var(--ease)}
  a:hover{color:#000}
  .container{max-width:640px;margin:0 auto;padding:0 40px}

  @keyframes lpUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes lpDrift{0%{transform:translate(0,0)}50%{transform:translate(-26px,24px)}100%{transform:translate(18px,-18px)}}
  @keyframes lpHaloDark{0%,100%{box-shadow:0 0 0 0 rgba(28,28,30,.12)}50%{box-shadow:0 0 0 18px rgba(28,28,30,0)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }

  .nav-wrap{
    position:sticky;top:0;z-index:50;
    background:transparent;
    border-bottom:1px solid transparent;
    transition:background .4s var(--ease), box-shadow .4s var(--ease), backdrop-filter .4s var(--ease), border-color .4s var(--ease);
  }
  .nav-wrap.scrolled{
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-color:var(--hairline);
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    max-width:1140px;margin:0 auto;padding:22px 40px;
  }
  .nav-left{display:flex;align-items:center;gap:13px}
  .nav-icon{width:32px;height:32px;border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .35s var(--ease)}
  .nav-left:hover .nav-icon{transform:scale(1.1) rotate(-4deg)}
  .wordmark{font-size:17px;font-weight:600;letter-spacing:-0.4px}
  .nav-right{display:flex;align-items:center;gap:26px}
  .nav-right a{font-size:14px;color:oklch(45% 0 0)}
  .nav-right a:hover{color:#000}

  main.container{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:96px 40px;
    position:relative;
  }
  main.container::before{
    content:'';
    position:absolute;
    top:-160px;right:-180px;
    width:460px;height:460px;
    background:radial-gradient(circle, rgba(28,28,30,.05), transparent 70%);
    filter:blur(30px);
    animation:lpDrift 18s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }
  .eyebrow,h1,.lead,.contact-card,.form-note{position:relative;z-index:1}
  .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:oklch(58% 0 0);margin-bottom:14px;opacity:0;animation:lpUp .6s var(--ease) .05s both}
  h1{font-size:38px;line-height:1.1;font-weight:600;letter-spacing:-1.2px;margin:0 0 14px;opacity:0;animation:lpUp .6s var(--ease) .12s both}
  .lead{font-size:16px;line-height:1.6;color:var(--muted);max-width:440px;margin-bottom:36px;opacity:0;animation:lpUp .6s var(--ease) .19s both}

  .contact-card{
    border:1.4px solid var(--hairline);
    border-radius:22px;
    padding:28px;
    display:flex;
    align-items:center;
    gap:16px;
    opacity:0;
    animation:lpUp .6s var(--ease) .26s both;
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
  }
  .contact-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.08);border-color:transparent}
  .contact-icon{
    width:44px;height:44px;border-radius:12px;
    background:oklch(95% .003 90);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:transform .35s var(--ease), background .35s var(--ease);
    animation:lpHaloDark 3s ease-in-out 1s infinite;
  }
  .contact-card:hover .contact-icon{background:var(--ink);transform:scale(1.08) rotate(-6deg)}
  .contact-card:hover .contact-icon svg{stroke:#fff}
  .contact-icon svg{width:20px;height:20px;transition:stroke .35s var(--ease)}
  .contact-card .label{font-size:12.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:oklch(55% 0 0);margin-bottom:4px}
  .contact-card .value{font-size:19px;font-weight:600}
  .contact-card a.value:hover{color:#000}

  .form-note{font-size:14px;color:oklch(58% 0 0);margin-top:20px;opacity:0;animation:lpUp .6s var(--ease) .33s both}

  footer{background:var(--dark);color:#fff;padding:44px 0}
  .footer-row{
    max-width:1140px;margin:0 auto;padding:0 40px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .footer-left{display:flex;align-items:center;gap:10px}
  .footer-left img{width:20px;height:20px;border-radius:5px;transition:transform .35s var(--ease)}
  .footer-left:hover img{transform:scale(1.15) rotate(-6deg)}
  .footer-left span{font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
  .footer-right{display:flex;gap:26px}
  .footer-right a{font-size:13.5px;color:rgba(255,255,255,.45)}
  .footer-right a:hover{color:#fff}

  @media (max-width:640px){
    .nav{padding:18px 24px}
    .container{padding:0 24px}
    main.container{padding:64px 24px}
    .footer-row{padding:0 24px;flex-direction:column;gap:16px;align-items:flex-start}
    h1{font-size:30px}
    .contact-card{flex-direction:column;align-items:flex-start;text-align:left}
  }
</style>
</head>
<body>

<div class="nav-wrap">
  <header class="nav">
    <a href="index.html" class="nav-left" style="cursor:pointer">
      <img class="nav-icon" src="app-icon-6a-60.png" alt="Grimo AI icon" width="32" height="32">
      <span class="wordmark">Grimo AI</span>
    </a>
    <nav class="nav-right">
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
      <a href="index.html#faq">FAQ</a>
    </nav>
  </header>
</div>

<main class="container">
  <div class="eyebrow">Contact</div>
  <h1>Let's talk.</h1>
  <p class="lead">Question, bug report, feature idea — whatever it is, we'd like to hear it.</p>

  <a class="contact-card" href="mailto:hello@grimoai.app">
    <div class="contact-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
    </div>
    <div>
      <div class="label">Email</div>
      <span class="value">hello@grimoai.app</span>
    </div>
  </a>
  <div class="form-note">We usually reply within a day.</div>
</main>

<footer>
  <div class="footer-row">
    <a href="index.html" class="footer-left" style="cursor:pointer">
      <img src="app-icon-6a-60.png" alt="Grimo AI icon">
      <span>Grimo AI</span>
    </a>
    <div class="footer-right">
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script>
  var navWrap = document.querySelector('.nav-wrap');
  function onScrollNav(){
    if(window.scrollY > 10){ navWrap.classList.add('scrolled'); }
    else { navWrap.classList.remove('scrolled'); }
  }
  window.addEventListener('scroll', onScrollNav, {passive:true});
  onScrollNav();
</script>

</body>
</html>
